# Update PRs for Go modules, pinned actions and Dockerfile base images. PR titles follow
# Conventional Commits (pr-title.yml) so they flow through Release Please.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "fix(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
