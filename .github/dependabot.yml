# Update PRs for Go modules, and pinned actions (image contents come from flake.lock). PR titles follow
# Conventional Commits (pr-title.yml) so they flow through Release Please.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "fix(deps)" }
    # One PR for all Go modules: separate PRs each carry a vendorHash for their own go.sum, and merging
    # several of them leaves master with a combined go.sum that matches none of those hashes.
    groups:
      go:
        patterns: ["*"]
    ignore:
      # test only, pinned on purpose: the oldest go-tfe a supported Terraform ships (see cloud_gotfe_test.go)
      - dependency-name: github.com/hashicorp/go-tfe
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
    # init and analyze must run the same version, separate PRs each fail with a version mismatch.
    groups:
      codeql:
        patterns: ["github/codeql-action*"]
