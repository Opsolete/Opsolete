name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opsolete_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/opsolete_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest patch, so govulncheck judges the stdlib we ship (images use nixpkgs' go: keep flake.lock fresh).
          go-version: 1.26.x
          check-latest: true # otherwise the runner image's preinstalled (possibly older) 1.26 is used
      # Same version as the runner image; the wrapper would break terraform-exec's output parsing.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::run gofmt -w ."; exit 1; }
      - run: go vet ./...
      - run: go test -count=1 -p 1 ./... # -p 1: DB tests share one database and its job queue
      # Reports only vulnerabilities in code paths the binary actually calls.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # The nix package is what `just build`/`just smoke` use; this also catches a stale vendorHash.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix build -L

  # Build and scan both images on every CI run; publishing lives in release.yml so a
  # Release Please/API failure can never skip this validation.
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [app, runner]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # shortcut: linux/amd64 only; build .#packages.aarch64-linux.image-* on an arm runner for arm nodes.
      - run: nix build -L .#image-${{ matrix.target }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: result
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          output: trivy.txt
      - if: ${{ !cancelled() }}
        run: |
          { echo "### Trivy: ${{ matrix.target }} image (fixable HIGH/CRITICAL)"; echo '```'; cat trivy.txt 2>/dev/null || echo "scan did not run"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
