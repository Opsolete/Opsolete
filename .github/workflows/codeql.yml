name: codeql

# Static security analysis of the Go code and of these workflows; findings land in Security > Code scanning.
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 4 * * 1" # weekly, so new queries run against unchanged code too

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          # go/weak-sensitive-data-hashing: its only hit is secrets.derive, which hashes SECRET_KEY (a
          # random server key, not a user password) into an AES key; a slow KDF would change every key
          # id and leave the values already sealed undecryptable.
          config: |
            query-filters:
              - exclude:
                  id: go/weak-sensitive-data-hashing
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
