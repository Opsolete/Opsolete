# Dependabot bumps go.mod/go.sum but can't update flake.nix's vendorHash; this recomputes it
# and pushes the fix to the Dependabot branch. Humans changing go.mod: `just build` (or `just check`) does the same.
name: vendorhash

on:
  pull_request:
    paths: [go.mod, go.sum]

permissions:
  contents: read

concurrency:
  group: vendorhash-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  update:
    # Branch, not PR author: also runs after "Update branch"/rebase by a human, when go.sum changes again.
    if: startsWith(github.head_ref, 'dependabot/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # A PAT, not GITHUB_TOKEN: pushes made with GITHUB_TOKEN don't trigger ci.yml on the new commit.
      # DEPENDABOT_PUSH_TOKEN (fine-grained PAT, contents: write, this repo) must exist as BOTH a Dependabot
      # secret (runs triggered by Dependabot) and an Actions secret (runs triggered by a human updating the branch).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.DEPENDABOT_PUSH_TOKEN }}
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: recompute vendorHash
        run: |
          nix run --inputs-from . nixpkgs#just -- vendorhash # same recipe `just build` runs locally
          if git diff --quiet flake.nix; then echo "vendorHash is current (other build errors are ci.yml's nix job's to report)"; exit 0; fi
          nix build .#default.goModules --no-link # fail loudly if the new hash still doesn't match
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "fix(flake): update vendorHash"
          git push
