{{template "top"}}
<h1>{{.T.Name}}</h1>
{{if .Editor}}<p><a href="/templates/{{.T.ID}}/edit">Edit template</a></p>{{end}}
<p>{{.T.Description}}</p>
<form method="post">
{{$v := .Values}}{{$e := .Errors}}
{{range .T.Inputs}}
  <label for="{{.Name}}">{{or .Label .Name}}{{if .Required}} *{{end}}</label>
  {{if eq .Type "select"}}
    <select id="{{.Name}}" name="{{.Name}}">
      {{$cur := index $v .Name}}
      {{range .Options}}<option{{if eq . $cur}} selected{{end}}>{{.}}</option>{{end}}
    </select>
  {{else if eq .Type "bool"}}
    <input type="checkbox" id="{{.Name}}" name="{{.Name}}"{{if eq (index $v .Name) "on" "true"}} checked{{end}} style="min-width:0">
  {{else}}
    <input id="{{.Name}}" name="{{.Name}}" value="{{index $v .Name}}"
      {{if eq .Type "number"}}type="number" step="any"{{end}}{{if .Pattern}} pattern="{{.Pattern}}"{{end}}{{if .Required}} required{{end}}>
  {{end}}
  {{with index $e .Name}}<div class="err" role="alert">{{.}}</div>{{end}}
{{end}}
<button type="submit">Deploy</button>
</form>
{{template "bottom"}}
