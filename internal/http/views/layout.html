{{define "top"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form2Stack</title>
<style>
  :root {
    --bg: #f6f7fb; --surface: #fff; --text: #1d2433; --muted: #5d6b82; --border: #e3e7ee;
    --brand: #4f46e5; --brand-hover: #4338ca; --brand-soft: #eef0ff; --btn: #4f46e5; --btn-hover: #4338ca;
    --ok: #067647; --ok-soft: #e7f8ee; --warn: #a15c07; --warn-soft: #fff6e0;
    --danger: #c4320a; --danger-soft: #fdeeea; --code: #f1f3f8; --btn-danger: #c4320a;
    --radius: 12px; --shadow: 0 1px 2px rgb(16 24 40 / 5%), 0 2px 8px rgb(16 24 40 / 5%);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1117; --surface: #161b24; --text: #e5e9f0; --muted: #94a0b4; --border: #262d3a;
      --brand: #8b93ff; --brand-hover: #aab0ff; --brand-soft: #1f2247; --btn: #5145cd; --btn-hover: #5f55e0;
      --ok: #4ad295; --ok-soft: #0f2d20; --warn: #f5b84a; --warn-soft: #33260b;
      --danger: #ff8a70; --danger-soft: #3a1710; --code: #1e2430; --btn-danger: #b42318;
      --shadow: 0 1px 2px rgb(0 0 0 / 40%);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 70rem; margin: 0 auto; padding: 0 1.25rem; }
  main.wrap { padding-top: 2rem; padding-bottom: 4rem; }
  a { color: var(--brand); text-decoration: none; }
  a:hover { color: var(--brand-hover); text-decoration: underline; }
  h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 .3rem; letter-spacing: -.01em; }
  h2 { font-size: 1.1rem; margin: 2.2rem 0 .8rem; }
  h3 { font-size: 1.05rem; margin: 0 0 .35rem; }
  p { margin: 0 0 1rem; }
  .muted, small { color: var(--muted); }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  code { font-size: .85em; background: var(--code); padding: .1em .4em; border-radius: 5px; overflow-wrap: anywhere; }
  pre { margin: 0; overflow: auto; font-size: .85rem; }
  pre.code { background: var(--code); border-radius: var(--radius); padding: 1rem 1.2rem; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* top bar */
  .topbar { background: #111726; color: #fff; }
  .topbar .wrap { display: flex; align-items: center; gap: 1.5rem; min-height: 3.6rem; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: .55rem; color: #fff; font-weight: 700; font-size: 1.05rem; }
  .brand:hover { color: #fff; text-decoration: none; }
  .logo { display: grid; place-items: center; width: 1.9rem; height: 1.9rem; border-radius: 8px; font-size: .7rem;
    background: linear-gradient(135deg, #6366f1, #22d3ee); letter-spacing: -.03em; }
  .topbar nav { display: flex; gap: .25rem; }
  .topbar nav a { color: #b8c2d6; padding: .4rem .75rem; border-radius: 8px; font-weight: 500; }
  .topbar nav a:hover { color: #fff; background: rgb(255 255 255 / 8%); text-decoration: none; }
  .topbar nav a[aria-current="page"] { color: #fff; background: rgb(255 255 255 / 14%); }
  .who { margin-left: auto; display: flex; align-items: center; gap: .6rem; font-size: .85rem; color: #b8c2d6; }
  .who .tag { background: rgb(255 255 255 / 14%); color: #fff; }

  /* layout blocks */
  .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .page-head p { margin: 0; }
  .back { display: inline-block; margin-bottom: .75rem; font-size: .9rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.4rem; margin-bottom: 1rem; }
  .card.flush { padding: 0; overflow-x: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 1rem; }
  .tile { display: flex; flex-direction: column; margin: 0; transition: border-color .15s, transform .15s; }
  .tile:hover { border-color: var(--brand); transform: translateY(-1px); }
  .tile p { flex: 1; color: var(--muted); font-size: .92rem; }
  .tile footer { display: flex; justify-content: space-between; align-items: center; gap: .5rem; font-size: .9rem; }
  .empty { text-align: center; color: var(--muted); padding: 3rem 1rem; }
  .tag { display: inline-block; font-size: .72rem; font-weight: 600; padding: .12rem .55rem; border-radius: 999px; background: var(--brand-soft); color: var(--brand); }
  .kv { display: grid; grid-template-columns: minmax(7rem, 11rem) 1fr; gap: .6rem 1.25rem; margin: 0; }
  .kv dt { color: var(--muted); font-size: .88rem; }
  .kv dd { margin: 0; }

  /* forms */
  label { display: block; margin: 1.1rem 0 .35rem; font-weight: 600; font-size: .9rem; }
  label:first-child { margin-top: 0; }
  .req { color: var(--danger); }
  input, select { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: .5rem .7rem; width: 100%; max-width: 34rem; }
  input:hover, select:hover { border-color: var(--muted); }
  input:focus, select:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
  input[type="checkbox"] { width: 1.1rem; height: 1.1rem; accent-color: var(--brand); vertical-align: middle; }
  input[type="file"] { padding: .4rem; }
  .wide { max-width: none; }
  .hint { font-size: .85rem; color: var(--muted); margin: .35rem 0 0; }
  .err { color: var(--danger); font-size: .85rem; margin: .35rem 0 0; }
  .alert { border-radius: 10px; padding: .8rem 1rem; margin: 0 0 1rem; font-size: .92rem; }
  .alert.error { background: var(--danger-soft); color: var(--danger); }
  .alert.warn { background: var(--warn-soft); color: var(--warn); }
  .actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-top: 1.6rem; }
  .inline { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  .inline select, .inline input { flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: 0 0 1rem; }
  .chips a { font-size: .8rem; padding: .2rem .65rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .chips a:hover { border-color: var(--brand); text-decoration: none; }
  .chips a[aria-current="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }

  /* buttons */
  button, .btn { display: inline-flex; align-items: center; gap: .4rem; font: inherit; font-weight: 600; font-size: .92rem; cursor: pointer;
    padding: .5rem 1.05rem; border-radius: 8px; border: 1px solid transparent; background: var(--btn); color: #fff; white-space: nowrap; }
  button:hover, .btn:hover { background: var(--btn-hover); color: #fff; text-decoration: none; }
  .secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
  .secondary:hover { background: var(--code); color: var(--text); }
  .danger { background: var(--btn-danger); }
  .danger:hover { background: var(--btn-danger); filter: brightness(.92); }
  .small { padding: .25rem .65rem; font-size: .8rem; }
  .topbar .secondary { background: transparent; color: #dbe2ef; border-color: rgb(255 255 255 / 20%); }
  .topbar .secondary:hover { background: rgb(255 255 255 / 10%); }

  /* tables */
  table { border-collapse: collapse; width: 100%; font-size: .92rem; }
  th, td { text-align: left; padding: .65rem 1rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--bg); }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: color-mix(in srgb, var(--brand-soft) 35%, transparent); }
  td.nowrap { white-space: nowrap; }
  .card.flush table th:first-child, .card.flush table td:first-child { padding-left: 1.4rem; }

  /* status badges */
  .status { display: inline-flex; align-items: center; gap: .4rem; padding: .15rem .65rem; border-radius: 999px; font-size: .78rem;
    font-weight: 600; white-space: nowrap; background: var(--code); color: var(--muted); vertical-align: middle; }
  .status::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: currentColor; }
  .status.queued, .status.plan_queued, .status.apply_queued { background: var(--warn-soft); color: var(--warn); }
  .status.needs_confirmation { background: var(--warn); color: var(--surface); }
  .status.running, .status.planning, .status.applying { background: var(--brand-soft); color: var(--brand); }
  .status.running::before, .status.planning::before, .status.applying::before { animation: pulse 1.2s ease-in-out infinite; }
  .status.succeeded, .status.applied, .status.no_changes { background: var(--ok-soft); color: var(--ok); }
  .status.failed, .status.errored, .status.canceled { background: var(--danger-soft); color: var(--danger); }
  .plan { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; }
  .change { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .change.create { color: var(--ok); }
  .change.update { color: var(--warn); }
  .change.delete, .change.replace { color: var(--danger); }
  @keyframes pulse { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { .status::before { animation: none !important; } .tile { transition: none; } }

  /* live log */
  pre.log { background: #0b0f19; color: #d4dae5; border-radius: var(--radius); padding: 1rem 1.2rem; max-height: 34rem;
    white-space: pre-wrap; font-size: .8rem; line-height: 1.5; border: 1px solid #1e2533; }
</style>
</head>
<body>
<header class="topbar"><div class="wrap">
  <a class="brand" href="/"><span class="logo" aria-hidden="true">F2S</span>Form2Stack</a>
  <nav aria-label="Main">
    {{$s := section}}{{with features}}
    {{if .Deployments}}
    <a href="/"{{if or (eq $s "") (eq $s "templates")}} aria-current="page"{{end}}>Templates</a>
    <a href="/workspaces"{{if eq $s "workspaces"}} aria-current="page"{{end}}>Workspaces</a>
    <a href="/resources"{{if eq $s "resources"}} aria-current="page"{{end}}>Resources</a>
    {{end}}
    {{if .Registry}}<a href="/registry"{{if eq $s "registry"}} aria-current="page"{{end}}>Registry</a>{{end}}
    {{end}}
  </nav>
  {{with user}}{{if .Email}}
  <form class="who" method="post" action="/auth/logout">
    <span>{{.Email}}</span>{{if .Admin}}<span class="tag">admin</span>{{end}}
    <button type="submit" class="secondary small">Log out</button>
  </form>
  {{end}}{{end}}
</div></header>
<main class="wrap">
{{end}}
{{define "bottom"}}</main>
</body>
</html>{{end}}
